# Quickshell — shell runtime + widget backends
#
# Install with: paru -S --needed - < packages/deps-quickshell.conf
#
# Most packages are from the official repos. A few fonts and the Qt dark theme
# are AUR-only and are marked with [AUR] — paru/yay handles both transparently.
#
# Everything needed for the Quickshell-based Hyprland interface to work correctly:
#   theming, fonts, media, system integration, and helper utilities.

# ── Quickshell + Qt6 ─────────────────────────────────────────────────────────
#
# NOTE: quickshell itself is NOT listed here on purpose.
#
# The AUR's quickshell-git tracks upstream master, so every `yay -Syu` rebuilds
# it against whatever landed that day — and quickshell breaks QML APIs often.
# end-4 pins a specific commit in sdata/dist-arch/illogical-impulse-quickshell-git,
# and `setup upstream deps` builds that PKGBUILD straight from the cache clone.
# The pin then travels with overlay/hyprland/upstream.lock: update the shell and
# the matching quickshell build comes with it.
#
# It also installs a pacman hook that checks quickshell against qt6-base and
# qt6-wayland after every upgrade.
#
# The qt6-* packages below are already dependencies of that metapackage; they
# stay listed as documentation of what the shell needs.
qt6-base
qt6-declarative
qt6-wayland
qt6-svg
qt6-5compat
qt6-imageformats
qt6-avif-image-plugin
qt6-multimedia
qt6-positioning
qt6-quicktimeline
qt6-sensors
qt6-virtualkeyboard
qt6-translations
qt6-tools
kirigami                    # Qt/KDE UI components used by the shell
kdialog                     # Native dialogs
syntax-highlighting         # Code highlighting (AI chat / notes)

# ── Fonts ────────────────────────────────────────────────────────────────────
ttf-nerd-fonts-symbols-mono        # Nerd Font symbols for bar icons (Wi-Fi, BT, workspaces…)
ttf-jetbrains-mono-nerd            # Monospace + Nerd Font glyphs
otf-space-grotesk                  # UI display font
ttf-readex-pro                     # UI font
ttf-rubik-vf                       # UI font
ttf-material-symbols-variable-git  # Bar icons (Material Symbols Rounded)             [AUR]
ttf-twemoji                        # Color emoji                                       [AUR]

# ── Theming ──────────────────────────────────────────────────────────────────
matugen                     # Material You color generation from wallpaper (official extra)
adw-gtk-theme               # GTK theme
breeze                      # Qt/KDE base theme
breeze-plus                 # Extended Breeze icon theme (provides breeze-plus-dark)   [AUR]
darkly-bin                  # Qt dark style                                            [AUR]

# ── Audio / media ────────────────────────────────────────────────────────────
pipewire-pulse              # PulseAudio replacement (PipeWire)
wireplumber                 # PipeWire session manager
pavucontrol-qt              # Volume control GUI
playerctl                   # MPRIS media control
libdbusmenu-gtk3            # Tray menu support

# ── System integration (widgets need these backends) ─────────────────────────
networkmanager              # Wi-Fi / network widget backend
plasma-nm                   # NetworkManager applet/data
gnome-keyring               # Secret storage (AI API keys, etc.)
bluedevil                   # Bluetooth widget backend
upower                      # Battery / power info
brightnessctl               # Screen brightness
ddcutil                     # External monitor brightness (DDC/CI)
geoclue                     # Location (night light scheduling)

# ── Shell utilities ──────────────────────────────────────────────────────────
libqalculate                # Calculator backend (launcher math)
imagemagick                 # Image processing (wallpaper / thumbnails)
glib2                       # gsettings / glib tooling
translate-shell             # Translator feature
songrec                     # Music recognition (Shazam-like)

# ── CLI tools used by shell scripts ──────────────────────────────────────────
jq                          # JSON parsing in scripts
curl                        # HTTP requests
wget                        # Downloads
ripgrep                     # Fast search
bc                          # Math in scripts
go-yq                       # YAML processing
xdg-user-dirs               # Standard user directories
rsync                       # File sync (install/setup scripts)

# ── Optional: KDE apps (heavier; uncomment if wanted) ─────────────────────────
# dolphin                   # File manager
# systemsettings            # KDE system settings

# ── Python venv (scripts/*-venv.sh, switchwall.sh, color generation) ─────────
# These build the venv at ~/.local/state/quickshell/.venv from
# packages/requirements.txt. Without them wallpaper color extraction, thumbnail
# generation and region detection all fail silently.
uv                          # Python package/runtime manager
gtk4
libadwaita
libsoup3                    # HTTP for the GObject-based helpers
libportal-gtk4              # Portal access from the helpers
gobject-introspection       # Builds pygobject
clang                       # Builds native wheels (opencv, pycairo)
cmake                       # Same
