# Display manager — SDDM + the astronaut theme
#
# Install with:
#   paru -S --needed $(awk '!/^[[:space:]]*#/ && NF {print $1}' packages/deps-greeter-sddm.conf)
#
# Note the awk: 'paru -S -' reads stdin verbatim and would try to install the
# comments too. 'setup post' uses parse_packages() in cmd/lib/utils.sh instead.
#
# Desktop-agnostic: the same login screen serves both the Hyprland and the KDE
# session, and it is what lets you pick between them at login.

# ── Display manager ──────────────────────────────────────────────────────────
sddm                        # Qt display manager (Wayland-capable)

# ── Theme ────────────────────────────────────────────────────────────────────
# https://github.com/Keyitdev/sddm-astronaut-theme                        [AUR]
# Ships several variants under Themes/; post-install.sh selects one and a pacman
# hook re-applies the choice after every upgrade of this package, because the
# selection lives in a file the package owns.
sddm-astronaut-theme

# Pulled in as dependencies of the theme, listed here as documentation of what
# the login screen needs at runtime:
qt6-5compat                 # Qt5 compatibility module used by the theme's QML
qt6-declarative             # QML runtime
qt6-svg                     # SVG icons
qt6-virtualkeyboard         # On-screen keyboard on the login field
qt6-multimedia-ffmpeg       # Animated/video backgrounds
