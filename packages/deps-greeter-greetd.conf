# Greeter — greetd + sysc-greet, Cagebreak variant
#
# Install with:
#   paru -S --needed $(awk '!/^[[:space:]]*#/ && NF {print $1}' packages/deps-greeter-greetd.conf)
#
# Note the awk: 'paru -S -' reads stdin verbatim and would try to install the
# comments too. 'setup post' uses parse_packages() in cmd/lib/utils.sh instead.
#
# The alternative to SDDM: a console-based greeter instead of a Qt login screen.
# Pick one with 'setup greeter greetd' or 'setup greeter sddm' — only one display
# manager can be enabled at a time.
#
# Worth choosing over SDDM when: the GPU makes SDDM's weston greeter misbehave
# (invisible cursor, wrong monitor), or you simply want a lighter login that
# boots straight into a terminal-shaped session picker.
#
# Worth choosing SDDM instead when: you want a graphical themed login, or you
# switch between the Hyprland and Plasma sessions often.

# ── Daemon ───────────────────────────────────────────────────────────────────
greetd                      # Minimal, compositor-agnostic login daemon
seatd                       # Seat management — greetd needs it; SDDM does not
                            # (it uses logind). 'setup greeter sddm' disables it
                            # again, because both running at once makes weston
                            # fail to take the input devices.

# ── Greeter ──────────────────────────────────────────────────────────────────
# https://github.com/b1rger/sysc-greet                                    [AUR]
#
# Cagebreak variant: runs the greeter inside Cagebreak, a tiny tiling Wayland
# compositor. The other variants embed niri (sysc-greet) or Hyprland
# (sysc-greet-hyprland); Cagebreak is the smallest of the three and pulls in the
# least on a machine that already has its own compositor.
sysc-greet-cagebreak

# Dependencies of the greeter, listed as documentation of what it needs at
# runtime — paru resolves them anyway:
cagebreak                   # The tiny tiling compositor the greeter runs in
kitty                       # Terminal the greeter draws itself in
socat                       # IPC between the greeter and cagebreak
gslapper                    # Session picker used by sysc-greet
