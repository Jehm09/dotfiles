# KDE Plasma 6 desktop dependencies.
#
# One package per line, "#" comments. Installed by post-install.sh with paru/yay,
# which handles official repos and the AUR transparently.
#
# Wayland only: Plasma 6.8 (Oct 2026) removes the X11 session.
#
# Not everything is a package — see "INSTALLED OUTSIDE PACMAN" at the bottom.

# ══════════════════════════════════════════════════════════════════════════════
# Official repos
# ══════════════════════════════════════════════════════════════════════════════

plasma-meta               # Full Plasma 6 desktop (kwin, plasma-workspace, spectacle,
                          # powerdevil, kscreen, plasma-nm, bluedevil, systemsettings…)

tesseract-data-spa        # Spectacle's "Extract Text" OCR — Spanish
tesseract-data-eng        # idem, English. Without these the button is hidden.

plasma-systemmonitor      # Task manager
kwalletmanager            # KWallet GUI
power-profiles-daemon     # PowerDevil's performance profile switcher

dolphin                   # File manager (ships Meta+E itself)
ark                       # Archives — adds Dolphin's extract/compress actions
gwenview                  # Image viewer
okular                    # PDF viewer
kate                      # Text editor (Super+X)
kcolorchooser             # Companion to the Plasma colour picker widget

# ══════════════════════════════════════════════════════════════════════════════
# AUR
# ══════════════════════════════════════════════════════════════════════════════

## Lanzador: KRunner, incluido en plasma-meta. Se engancha a la tecla Meta con un
## "atajo de comando" creado desde Ajustes > Atajos, que genera
## .local/share/applications/net.local.krunner.desktop (vendorizado).
##
## Se descartó rofi: no calcula en línea en la búsqueda base (rofi-calc está
## diseñado como modo suelto, no para combi) ni cierra al clicar fuera bajo
## layer-shell. KRunner hace ambas cosas de fábrica.

kdotool                   # Query the active window's geometry from a shell (it loads
                          # a throwaway KWin script to do it). Needed by
                          # dots/kde/.config/kde/scripts/focus-warp.sh, because KWin
                          # exposes workspace.cursorPos as READ-ONLY so a KWin script
                          # cannot warp the pointer itself.
ydotool                   # Moves the pointer via /dev/uinput, bypassing the Wayland
                          # protocol KWin lacks. Needs ydotool.service enabled.
                          # Also in deps-hyprland.conf, declared here for KDE-only installs.

bibata-cursor-theme       # Bibata-Modern-Classic, the cursor in use. Also in
                          # deps-hyprland.conf, but that file is not installed on a
                          # KDE-only machine, so it must be declared here too.

darkly-bin                # Qt widget style. kdeglobals sets widgetStyle=Darkly, so
                          # without this Plasma silently falls back to Breeze. Its
                          # config lives in dots/common/.config/darklyrc — in common,
                          # not hyprland, precisely because both desktops use it.

## Panel widgets — QML plasmoids, just files. They break only on QML API changes,
## unlike the compiled KWin effect below.
plasma6-applets-panel-colorizer   # Per-widget panel background/colour. This is what
                                  # makes the panel transparent, not a global theme.
plasma6-applets-kara-git          # Dot-style virtual desktop pager
plasma6-applets-plasmusic-toolbar # Now-playing with album art
plasma6-applets-window-title      # Active window app + title (%a / %w / %q).
                                  # No native equivalent exists. Upstream issues #40,
                                  # #42 (Plasma 6.6/6.7) and #22 (zero width when no
                                  # window) are open — if it breaks it just fails to draw.

## KWin effect — compiled against KWin's unstable internal API. Stops loading after
## every kwin update, and `paru -Syu` will NOT rebuild it because pkgver is fixed.
## dots/kde/.config/kde/scripts/check-kwin-effects.sh warns you at login; the fix is
##   paru -S --rebuild kwin-effect-rounded-corners
kwin-effect-rounded-corners  # Effect id kwin4_effect_shapecorners. Enabling it needs a
                             # logout or `qdbus org.kde.KWin /Effects loadEffect
                             # kwin4_effect_shapecorners` — reconfigure is not enough.

# ══════════════════════════════════════════════════════════════════════════════
# INSTALLED OUTSIDE PACMAN
#
# These are not packages. They live in the repo and land in $HOME through
# `setup kde apply`, driven by dots/kde/files.list. Provenance and any local
# patches are documented in dots/kde/VENDORED.md.
# ══════════════════════════════════════════════════════════════════════════════
#
# Scratchy — global theme, KDE Store p/1898344, GPL 3+
#   dots/kde/.local/share/plasma/look-and-feel/Scratchy/
#   dots/kde/.local/share/aurorae/themes/Scratchy/
#   dots/kde/.local/share/plasma/desktoptheme/Scratchy/
#   dots/kde/.local/share/color-schemes/Scratchy.colors
#   A Plasma 6 global theme is those four packages; all must be present.
#
# YAMIS — icon theme, opendesktop p/2303161, GPL 3
#   dots/kde/.local/share/icons/YAMIS/          (20 MB, 3960 files + 2070 symlinks)
#
# Thermal Monitor — KDE Store p/998915, MIT, upstream invent.kde.org/olib/thermalmonitor
#   dots/kde/.local/share/plasma/plasmoids/org.kde.olib.thermalmonitor/
#   Vendored at 0.2.8 instead of using AUR plasma6-applets-thermal-monitor, which
#   is 0.2.7-2 and was flagged out-of-date on 2026-07-20.
#
# SCP menu (scpmk) — power menu, KDE Store
#   dots/kde/.local/share/plasma/plasmoids/org.kde.plasma.scpmk/
#   PATCHED: upstream imports org.kde.plasma.private.quicklaunch, which no longer
#   exists in Plasma 6.7, so the widget failed to load. Replaced with Plasma5Support.
#
# Krohnkite — tiling KWin script, 0.9.9.2, MIT
#   dots/kde/.local/share/kwin/scripts/krohnkite/     (532 kB, 10 files)
#   Enabled through kwinrc [Plugins] krohnkiteEnabled=true, which is tracked.
#   Vendored because its AUR package fails to build: the first source is Codeberg's
#   auto-generated tarball, which Forgejo regenerates, breaking the pinned sha256.
#   Only the LICENSE comes from that tarball; the real payload,
#   krohnkite.kwinscript, does verify —
#   sha256 42f7f66531d366c74b5fc860381da3517ccb4cdccd1f80c122fcab6e9a8fcf7e
