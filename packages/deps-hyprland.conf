# Hyprland — window manager + Wayland session tools
#
# Install with:
#   paru -S --needed $(awk '!/^[[:space:]]*#/ && NF {print $1}' packages/deps-hyprland.conf)
#
# Note the awk: 'paru -S -' reads stdin verbatim and would try to install the
# comments too. 'setup post' uses parse_packages() in cmd/lib/utils.sh instead.
#
# Everything needed for Hyprland to run as a fully functional Wayland session.

# ── Compositor ───────────────────────────────────────────────────────────────
hyprland                    # Wayland compositor / window manager
hyprsunset                  # Blue-light / color temperature (night light)

# ── Session: lock, idle, color pick ─────────────────────────────────────────
hypridle                    # Idle daemon (triggers lock / dpms)
hyprlock                    # Lock screen
hyprpicker                  # Color picker

# ── Clipboard ────────────────────────────────────────────────────────────────
wl-clipboard                # wl-copy / wl-paste
cliphist                    # Clipboard history (used by the shell)

# ── Screenshot / screen recording ────────────────────────────────────────────
hyprshot                    # Screenshot helper
slurp                       # Region selection
swappy                      # Screenshot annotation
wf-recorder                 # Screen recording
tesseract                   # OCR (text from screenshots)
tesseract-data-eng          # OCR English language data

# ── XDG desktop portals ──────────────────────────────────────────────────────
xdg-desktop-portal          # Portal frontend
xdg-desktop-portal-hyprland # Screencast / screenshot backend for Hyprland
xdg-desktop-portal-gtk      # GTK file pickers / settings
xdg-desktop-portal-kde      # KDE/Qt file pickers / settings

# ── Auth / input ─────────────────────────────────────────────────────────────
polkit-kde-agent            # PolicyKit authentication agent
wtype                       # Wayland type emulation (on-screen keyboard)
ydotool                     # Input automation daemon

# ── Launcher / power menu ────────────────────────────────────────────────────
fuzzel                      # App launcher (fallback / dmenu-like)
wlogout                     # Power / logout menu

# --- Cursor ---
bibata-cursor-theme
