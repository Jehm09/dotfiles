general {
    col.active_border = rgba(a38a9877)
    col.inactive_border = rgba(56414d55)
}

misc {
    background_color = rgba(1b1017FF)
}

plugin {
    hyprbars {
        # Honestly idk if it works like css, but well, why not
        bar_text_font = Google Sans Flex Medium, Rubik, Geist, AR One Sans, Reddit Sans, Inter, Roboto, Ubuntu, Noto Sans, sans-serif
        bar_height = 30
        bar_padding = 10
        bar_button_padding = 5
        bar_precedence_over_border = true
        bar_part_of_window = true

        bar_color = rgba(1b1017FF)
        col.text = rgba(f3dde7FF)


        # example buttons (R -> L)
        # hyprbars-button = color, size, on-click
        hyprbars-button = rgb(f3dde7), 13, 󰖭, hyprctl dispatch killactive
        hyprbars-button = rgb(f3dde7), 13, 󰖯, hyprctl dispatch fullscreen 1
        hyprbars-button = rgb(f3dde7), 13, 󰖰, hyprctl dispatch movetoworkspacesilent special
    }
}

windowrule = border_color rgba(ffade2AA) rgba(ffade277), match:pin 1
