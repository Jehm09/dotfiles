# Flags de arranque de Brave. /usr/bin/brave lee este fichero
# ($XDG_CONFIG_HOME/brave-flags.conf) y añade cada línea a la orden.

# ── Recuperar la sesión tras un cierre brusco ───────────────────────────────
# Brave no implementa XSMP, así que ksmserver no puede pedirle que cierre
# ordenadamente: corre en un scope de systemd (app-org.chromium.Chromium-*.scope)
# y al terminar la sesión se lo llevan antes de volcar sesión e historial. Eso
# deja profile.exit_type="Crashed" y pierde ventanas y pestañas.
#
# Con esto Brave restaura la última sesión SIEMPRE, incluso tras un cierre sucio,
# sin depender de la opción "Continuar donde lo dejaste" del perfil.
--restore-last-session

# ── Wayland nativo ─────────────────────────────────────────────────────────
--ozone-platform-hint=wayland
--enable-wayland-ime
--gtk-version=4
