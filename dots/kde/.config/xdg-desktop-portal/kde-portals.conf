# Portal backend for the Plasma session only.
#
# xdg-desktop-portal reads <lowercase XDG_CURRENT_DESKTOP>-portals.conf, so this
# file applies when XDG_CURRENT_DESKTOP=KDE and never touches the Hyprland
# session (which keeps using ~/.config/xdg-desktop-portal/portals.conf).
# Both sessions can therefore stay installed side by side.
[preferred]
default=kde
org.freedesktop.impl.portal.Screenshot=kde
org.freedesktop.impl.portal.ScreenCast=kde
org.freedesktop.impl.portal.RemoteDesktop=kde
org.freedesktop.impl.portal.FileChooser=kde
org.freedesktop.impl.portal.Settings=kde
