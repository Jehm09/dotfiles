### Límite global: 144 fps (refresco del monitor). Si el juego tiene uno más bajo, gana el del juego
fps_limit=144
fps_limit_method=late

### Ubicación y tamaño
position=top-right
font_size=20
background_alpha=0.4

### Qué muestra
fps
frametime
frame_timing=0
gpu_stats
gpu_temp
cpu_stats
cpu_temp
vram

### Arranca oculto. SUPER+SHIFT+G (Hyprland, todos los juegos a la vez) o Shift der+F12 (dentro del juego) lo muestra/oculta
### SUPER+SHIFT+G quita/pone `no_display` en este archivo (el del repo): commitearlo siempre con la línea puesta
toggle_hud=Shift_R+F12
no_display
